<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Kitchen Listening Quiz | There is / There are</title>
    <link href="https://fonts.googleapis.com/css2?family=Comic+Neue:wght@400;700&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Poppins', 'Comic Neue', sans-serif;
            background: radial-gradient(circle at 20% 10%, #3b2a6b 0%, #1a1038 60%, #0b0620 100%);
            min-height: 100vh;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }
        body::before {
            content: "";
            position: fixed; top: -20%; left: -10%;
            width: 60%; height: 60%;
            background: radial-gradient(circle, rgba(255, 150, 210, 0.35), transparent 70%);
            filter: blur(70px); z-index: -2;
        }
        body::after {
            content: "";
            position: fixed; bottom: -20%; right: -10%;
            width: 60%; height: 60%;
            background: radial-gradient(circle, rgba(150, 200, 255, 0.35), transparent 70%);
            filter: blur(70px); z-index: -2;
        }

        .game-container {
            max-width: 1100px;
            margin: 0 auto;
            background: linear-gradient(160deg, rgba(45, 32, 90, 0.95), rgba(20, 12, 50, 0.95));
            backdrop-filter: blur(8px);
            border-radius: 55px;
            box-shadow:
                0 25px 60px rgba(0,0,0,0.6),
                0 0 0 2px rgba(255, 170, 220, 0.35),
                0 0 50px rgba(180, 140, 255, 0.35);
            overflow: hidden;
            padding-bottom: 25px;
        }

        .header {
            background: linear-gradient(135deg, #ff9ed8 0%, #b18cff 50%, #9ed8ff 100%);
            padding: 20px;
            text-align: center;
        }
        .header h1 {
            font-size: 1.9rem;
            color: #fff;
            text-shadow: 0 0 10px rgba(255,255,255,0.6), 0 0 22px rgba(255, 150, 220, 0.7);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
        }
        .sub {
            background: rgba(255,255,255,0.2);
            border: 1px solid rgba(255,255,255,0.4);
            display: inline-block;
            padding: 6px 20px;
            border-radius: 40px;
            font-size: 0.85rem;
            font-weight: bold;
            margin-top: 10px;
            color: #fff;
        }

        .progress-area {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 20px 25px 0;
            gap: 15px;
            flex-wrap: wrap;
        }
        .progress-text {
            background: linear-gradient(135deg, #ff9ed8, #b18cff);
            padding: 8px 22px;
            border-radius: 40px;
            color: #fff;
            font-weight: 700;
            font-size: 1rem;
            box-shadow: 0 0 20px rgba(255, 150, 220, 0.55);
            letter-spacing: 0.5px;
        }
        .score-text {
            background: linear-gradient(135deg, #9ed8ff, #c8b8ff);
            padding: 8px 22px;
            border-radius: 40px;
            color: #22134a;
            font-weight: 700;
            font-size: 1rem;
            box-shadow: 0 0 20px rgba(180, 200, 255, 0.6);
            letter-spacing: 0.5px;
        }

        .image-frame {
            margin: 20px 25px;
            background: linear-gradient(160deg, #ffffff 0%, #f7f2ff 100%);
            border-radius: 40px;
            padding: 15px;
            border: 3px solid rgba(255, 170, 220, 0.7);
            box-shadow: inset 0 0 60px rgba(200, 180, 255, 0.15), 0 0 40px rgba(180, 140, 255, 0.4);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 300px;
        }
        .image-frame img {
            max-width: 100%;
            max-height: 450px;
            object-fit: contain;
            border-radius: 30px;
        }
        .image-placeholder {
            width: 100%;
            height: 300px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 12px;
            font-size: 2rem;
            color: #b18cff;
            font-weight: bold;
            background: linear-gradient(135deg, #ffe6f5, #e6e0ff);
            border-radius: 30px;
        }

        .question-area {
            margin: 0 25px 20px;
            background: linear-gradient(160deg, #3b2566 0%, #4a2878 50%, #5a3288 100%);
            border-radius: 35px;
            border: 3px solid rgba(180, 220, 255, 0.6);
            box-shadow: inset 0 0 40px rgba(180, 140, 255, 0.3), 0 0 30px rgba(255, 150, 220, 0.3);
            padding: 22px 25px;
            display: flex;
            align-items: center;
            gap: 20px;
            flex-wrap: wrap;
        }
        .question-icon {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: linear-gradient(135deg, #ff9ed8, #b18cff);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
            color: #fff;
            box-shadow: 0 0 25px rgba(255, 150, 220, 0.8);
            flex-shrink: 0;
        }
        .question-text {
            flex: 1;
            color: #ffc2e8;
            font-size: 1.4rem;
            font-weight: 700;
            text-shadow: 0 0 12px rgba(255, 170, 220, 0.8);
            letter-spacing: 0.5px;
            min-width: 200px;
        }
        .replay-btn {
            background: linear-gradient(135deg, #9ed8ff, #c8b8ff);
            border: none;
            width: 58px;
            height: 58px;
            border-radius: 50%;
            cursor: pointer;
            color: #22134a;
            font-size: 1.3rem;
            box-shadow: 0 0 22px rgba(180, 200, 255, 0.8), 0 4px 0 rgba(100, 80, 180, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            transition: transform 0.1s;
        }
        .replay-btn:active { transform: translateY(2px); }
        .replay-btn.playing { animation: pulseRing 1s ease-in-out infinite; }
        @keyframes pulseRing {
            0%, 100% { box-shadow: 0 0 22px rgba(180, 200, 255, 0.8), 0 4px 0 rgba(100, 80, 180, 0.5); }
            50% { box-shadow: 0 0 40px rgba(255, 170, 220, 0.95), 0 4px 0 rgba(100, 80, 180, 0.5); }
        }

        .answers-grid {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            gap: 22px;
            margin: 10px 25px 20px;
        }
        .answer-btn {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            border: 4px solid rgba(255, 255, 255, 0.7);
            background: linear-gradient(160deg, #b18cff 0%, #784bff 100%);
            color: #fff;
            font-family: inherit;
            font-weight: 700;
            font-size: 1.1rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 10px;
            box-shadow: 0 0 30px rgba(180, 140, 255, 0.6), inset 0 -6px 0 rgba(0,0,0,0.15);
            transition: transform 0.12s, box-shadow 0.2s;
            letter-spacing: 0.3px;
            line-height: 1.2;
            user-select: none;
        }
        .answer-btn:hover:not(:disabled) {
            transform: scale(1.06);
            box-shadow: 0 0 40px rgba(255, 150, 220, 0.9), inset 0 -6px 0 rgba(0,0,0,0.15);
        }
        .answer-btn:active:not(:disabled) { transform: scale(0.97); }
        .answer-btn:disabled { cursor: not-allowed; opacity: 0.9; }
        .answer-btn.correct {
            background: linear-gradient(160deg, #7bffb0 0%, #2ecc71 100%);
            box-shadow: 0 0 40px rgba(90, 255, 170, 0.95), inset 0 -6px 0 rgba(0,0,0,0.15);
            animation: correctPop 0.4s ease-out;
        }
        .answer-btn.wrong {
            background: linear-gradient(160deg, #ff9eb0 0%, #ff3c5c 100%);
            box-shadow: 0 0 40px rgba(255, 90, 130, 0.95), inset 0 -6px 0 rgba(0,0,0,0.15);
            animation: wrongShake 0.4s ease-out;
        }
        @keyframes correctPop {
            0% { transform: scale(1); }
            50% { transform: scale(1.15); }
            100% { transform: scale(1); }
        }
        @keyframes wrongShake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-8px); }
            75% { transform: translateX(8px); }
        }

        .answer-btn.number {
            background: linear-gradient(160deg, #9ed8ff 0%, #2b86ff 100%);
            font-size: 1.6rem;
            width: 130px;
            height: 130px;
            box-shadow: 0 0 30px rgba(150, 200, 255, 0.7), inset 0 -6px 0 rgba(0,0,0,0.15);
            text-transform: capitalize;
        }
        .answer-btn.number.full {
            font-size: 1.05rem;
            line-height: 1.25;
            padding: 15px;
        }
        .answer-btn.yes {
            background: linear-gradient(160deg, #b1ffc9 0%, #2ecc71 100%);
            color: #06200e;
            box-shadow: 0 0 30px rgba(120, 255, 170, 0.7), inset 0 -6px 0 rgba(0,0,0,0.15);
        }
        .answer-btn.no {
            background: linear-gradient(160deg, #ffb1c9 0%, #ff3c5c 100%);
            color: #2a0008;
            box-shadow: 0 0 30px rgba(255, 140, 170, 0.7), inset 0 -6px 0 rgba(0,0,0,0.15);
        }

        .feedback {
            text-align: center;
            font-size: 1.3rem;
            font-weight: 700;
            color: #ffc2e8;
            min-height: 40px;
            margin: 0 25px 10px;
            text-shadow: 0 0 14px rgba(255, 170, 220, 0.8);
            letter-spacing: 0.5px;
        }
        .feedback.good { color: #b1ffc9; text-shadow: 0 0 14px rgba(120, 255, 170, 0.9); }
        .feedback.bad  { color: #ffb1c9; text-shadow: 0 0 14px rgba(255, 140, 170, 0.9); }

        .next-area {
            text-align: center;
            margin: 10px 25px 0;
            min-height: 60px;
        }
        .next-btn {
            background: linear-gradient(135deg, #ff9ed8, #b18cff);
            border: none;
            font-size: 1.1rem;
            font-weight: 700;
            padding: 14px 38px;
            border-radius: 50px;
            cursor: pointer;
            color: #fff;
            box-shadow: 0 0 24px rgba(255, 150, 220, 0.8), 0 5px 0 rgba(120, 60, 180, 0.6);
            letter-spacing: 0.5px;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
        }
        .next-btn.visible { opacity: 1; pointer-events: auto; }
        .next-btn:active { transform: translateY(2px); }

        .final-screen {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 40px 25px;
            gap: 20px;
        }
        .final-screen.visible { display: flex; }
        .final-emoji { font-size: 5rem; animation: bounce 1s ease-in-out infinite; }
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }
        .final-title {
            color: #ffc2e8;
            font-size: 2rem;
            font-weight: 700;
            text-shadow: 0 0 18px rgba(255, 170, 220, 0.9);
        }
        .final-score {
            color: #c6e6ff;
            font-size: 1.4rem;
            font-weight: 600;
            text-shadow: 0 0 14px rgba(180, 220, 255, 0.8);
        }
        .restart-btn {
            background: linear-gradient(135deg, #9ed8ff, #c8b8ff);
            border: none;
            font-size: 1.1rem;
            font-weight: 700;
            padding: 14px 38px;
            border-radius: 50px;
            cursor: pointer;
            color: #22134a;
            box-shadow: 0 0 24px rgba(180, 200, 255, 0.8), 0 5px 0 rgba(100, 80, 180, 0.5);
            letter-spacing: 0.5px;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            margin-top: 10px;
        }
        .restart-btn:active { transform: translateY(2px); }

        @media (max-width: 680px) {
            .header h1 { font-size: 1.3rem; }
            .question-text { font-size: 1.1rem; }
            .answer-btn { width: 110px; height: 110px; font-size: 0.9rem; }
            .answer-btn.number { width: 100px; height: 100px; font-size: 1.3rem; }
            .answer-btn.number.full { font-size: 0.85rem; padding: 10px; }
            .image-frame img { max-height: 300px; }
            .question-icon { width: 48px; height: 48px; font-size: 1.4rem; }
            .replay-btn { width: 48px; height: 48px; font-size: 1.1rem; }
        }
    </style>
</head>
<body>
<div class="game-container">
    <div class="header">
        <h1><i class="fas fa-utensils"></i> Kitchen Listening Quiz <i class="fas fa-headphones"></i></h1>
        <div class="sub">Listen to the question → look at the picture → choose the answer</div>
    </div>

    <div class="progress-area">
        <div class="progress-text" id="progressText">Question 1 / 10</div>
        <div class="score-text" id="scoreText">Score: 0</div>
    </div>

    <div id="gameBlock">
        <div class="image-frame" id="imageFrame">
            <img id="kitchenImage" src="Kitchen.png" alt="Kitchen">
        </div>

        <div class="question-area">
            <div class="question-icon"><i class="fas fa-question"></i></div>
            <div class="question-text" id="questionText">Loading...</div>
            <button class="replay-btn" id="replayBtn" title="Repeat the question">
                <i class="fas fa-volume-up"></i>
            </button>
        </div>

        <div class="answers-grid" id="answersGrid"></div>

        <div class="feedback" id="feedback"></div>

        <div class="next-area">
            <button class="next-btn" id="nextBtn">
                Next question <i class="fas fa-arrow-right"></i>
            </button>
        </div>
    </div>

    <div class="final-screen" id="finalScreen">
        <div class="final-emoji">🎉</div>
        <div class="final-title">Great job!</div>
        <div class="final-score" id="finalScore">You got 0 out of 10</div>
        <button class="restart-btn" id="restartBtn">
            <i class="fas fa-rotate-right"></i> Play again
        </button>
    </div>
</div>

<script>
    // ============================================================
    // 📋 ВОПРОСЫ — ФИНАЛЬНАЯ ВЕРСИЯ
    // ============================================================
    const questions = [
        {
            type: "yesno",
            question: "Is there a fridge in the kitchen?",
            options: ["Yes, there is.", "No, there isn't."],
            correct: 0
        },
        {
            type: "howmany",
            question: "How many cupboards are there?",
            options: ["two", "three", "four"],
            correct: 1                                  // three
        },
        {
            type: "yesno",
            question: "Is there a clock in the kitchen?",
            options: ["Yes, there is.", "No, there isn't."],
            correct: 0                                  // часы есть
        },
        {
            type: "howmany",
            question: "How many chairs are there?",
            options: ["three", "four", "five"],
            correct: 2                                  // five
        },
        {
            type: "yesno",
            question: "Is there a cooker in the kitchen?",
            options: ["Yes, there is.", "No, there isn't."],
            correct: 0
        },
        {
            type: "howmany_full",
            question: "How many fridges are there?",
            options: ["There is one.", "There are two."],
            correct: 0                                  // There is one
        },
        {
            type: "yesno",
            question: "Is there a bed in the kitchen?",
            options: ["Yes, there is.", "No, there isn't."],
            correct: 1
        },
        {
            type: "yesno",
            question: "Are there any chairs in the kitchen?",
            options: ["Yes, there are.", "No, there aren't."],
            correct: 0
        },
        {
            type: "howmany_full",
            question: "How many tables are there?",
            options: ["There is one.", "There are two."],
            correct: 0                                  // There is one
        },
        {
            type: "yesno",
            question: "Is there a sofa in the kitchen?",
            options: ["Yes, there is.", "No, there isn't."],
            correct: 1
        }
    ];

    let currentQ = 0;
    let score = 0;
    let answered = false;

    const progressText = document.getElementById("progressText");
    const scoreText = document.getElementById("scoreText");
    const questionText = document.getElementById("questionText");
    const answersGrid = document.getElementById("answersGrid");
    const feedback = document.getElementById("feedback");
    const nextBtn = document.getElementById("nextBtn");
    const replayBtn = document.getElementById("replayBtn");
    const gameBlock = document.getElementById("gameBlock");
    const finalScreen = document.getElementById("finalScreen");
    const finalScore = document.getElementById("finalScore");
    const restartBtn = document.getElementById("restartBtn");
    const kitchenImage = document.getElementById("kitchenImage");
    const imageFrame = document.getElementById("imageFrame");

    // ============ АУДИО ============
    let audioCtx = null;
    function getAudioCtx() {
        if (!audioCtx) {
            try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
            catch (e) { return null; }
        }
        if (audioCtx.state === "suspended") audioCtx.resume();
        return audioCtx;
    }

    function playCorrectSound() {
        const ctx = getAudioCtx(); if (!ctx) return;
        const now = ctx.currentTime;
        [660, 880, 1320].forEach((freq, i) => {
            const osc = ctx.createOscillator();
            osc.type = "sine";
            osc.frequency.setValueAtTime(freq, now + i * 0.09);
            const gain = ctx.createGain();
            gain.gain.setValueAtTime(0.0001, now + i * 0.09);
            gain.gain.exponentialRampToValueAtTime(0.15, now + i * 0.09 + 0.02);
            gain.gain.exponentialRampToValueAtTime(0.0001, now + i * 0.09 + 0.2);
            osc.connect(gain).connect(ctx.destination);
            osc.start(now + i * 0.09);
            osc.stop(now + i * 0.09 + 0.22);
        });
    }

    function playWrongSound() {
        const ctx = getAudioCtx(); if (!ctx) return;
        const now = ctx.currentTime;
        const osc = ctx.createOscillator();
        osc.type = "triangle";
        osc.frequency.setValueAtTime(300, now);
        osc.frequency.exponentialRampToValueAtTime(150, now + 0.25);
        const gain = ctx.createGain();
        gain.gain.setValueAtTime(0.0001, now);
        gain.gain.exponentialRampToValueAtTime(0.18, now + 0.03);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.3);
        osc.connect(gain).connect(ctx.destination);
        osc.start(now); osc.stop(now + 0.32);
    }

    function speakText(text) {
        if (!text || !window.speechSynthesis) return;
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = "en-GB";
        utterance.rate = 0.85;
        utterance.pitch = 1.0;
        const voices = window.speechSynthesis.getVoices();
        const gb = voices.find(v => v.lang === "en-GB") ||
                   voices.find(v => v.lang.startsWith("en-GB")) ||
                   voices.find(v => v.lang === "en_GB");
        if (gb) utterance.voice = gb;

        utterance.onstart = () => replayBtn.classList.add("playing");
        utterance.onend = () => replayBtn.classList.remove("playing");
        utterance.onerror = () => replayBtn.classList.remove("playing");

        window.speechSynthesis.speak(utterance);
    }
    if (window.speechSynthesis) {
        window.speechSynthesis.onvoiceschanged = () => window.speechSynthesis.getVoices();
    }

    function tryLoadKitchenImage() {
        const exts = ["png", "jpg", "jpeg"];
        let i = 0;
        function attempt() {
            if (i >= exts.length) {
                imageFrame.innerHTML = '<div class="image-placeholder">🍳<div>Kitchen image not found</div><small>Add Kitchen.png (or .jpg / .jpeg)</small></div>';
                return;
            }
            const test = new Image();
            test.onload = () => { kitchenImage.src = `Kitchen.${exts[i]}`; };
            test.onerror = () => { i++; attempt(); };
            test.src = `Kitchen.${exts[i]}`;
        }
        attempt();
    }

    function renderQuestion() {
        answered = false;
        const q = questions[currentQ];

        progressText.textContent = `Question ${currentQ + 1} / ${questions.length}`;
        scoreText.textContent = `Score: ${score}`;
        questionText.textContent = q.question;
        feedback.textContent = "";
        feedback.className = "feedback";
        nextBtn.classList.remove("visible");
        answersGrid.innerHTML = "";

        q.options.forEach((opt, idx) => {
            const btn = document.createElement("button");
            btn.className = "answer-btn";

            if (q.type === "howmany") {
                btn.classList.add("number");
            } else if (q.type === "howmany_full") {
                btn.classList.add("number", "full");
            } else {
                if (opt.toLowerCase().startsWith("yes")) btn.classList.add("yes");
                else btn.classList.add("no");
            }
            btn.textContent = opt;
            btn.addEventListener("click", () => checkAnswer(idx, btn));
            answersGrid.appendChild(btn);
        });

        setTimeout(() => speakText(q.question), 300);
    }

    function checkAnswer(idx, btn) {
        if (answered) return;
        answered = true;

        const q = questions[currentQ];
        const allBtns = answersGrid.querySelectorAll(".answer-btn");
        allBtns.forEach(b => b.disabled = true);

        if (idx === q.correct) {
            btn.classList.add("correct");
            score++;
            scoreText.textContent = `Score: ${score}`;
            feedback.textContent = "✅ Well done!";
            feedback.className = "feedback good";
            playCorrectSound();
        } else {
            btn.classList.add("wrong");
            allBtns[q.correct].classList.add("correct");
            feedback.textContent = "❌ Oops! The correct answer is highlighted.";
            feedback.className = "feedback bad";
            playWrongSound();
        }

        nextBtn.classList.add("visible");
    }

    function nextQuestion() {
        currentQ++;
        if (currentQ >= questions.length) showFinal();
        else renderQuestion();
    }

    function showFinal() {
        gameBlock.style.display = "none";
        finalScreen.classList.add("visible");
        finalScore.textContent = `You got ${score} out of ${questions.length}`;
    }

    function restart() {
        currentQ = 0;
        score = 0;
        finalScreen.classList.remove("visible");
        gameBlock.style.display = "block";
        renderQuestion();
    }

    nextBtn.addEventListener("click", nextQuestion);
    replayBtn.addEventListener("click", () => {
        const q = questions[currentQ];
        speakText(q.question);
    });
    restartBtn.addEventListener("click", restart);

    tryLoadKitchenImage();
    renderQuestion();
</script>
</body>
</html>
